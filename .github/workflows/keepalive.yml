name: Keepalive

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Touch heartbeat
        run: date -u +"%Y-%m-%dT%H:%M:%SZ" > .github/heartbeat

      - name: Commit and push
        run: |
          git config user.name "monitor-bot"
          git config user.email "bot@monitor"
          git add .github/heartbeat
          git diff --staged --quiet || git commit -m "chore: keepalive heartbeat"
          git push

      - name: Send monthly Brevo heartbeat
        env:
          BREVO_USER: ${{ secrets.BREVO_USER }}
          BREVO_SMTP_KEY: ${{ secrets.BREVO_SMTP_KEY }}
          BREVO_SENDER: ${{ secrets.BREVO_SENDER }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
        run: |
          day_of_month=$(date -u +%d)
          if [ "$day_of_month" -gt 7 ] && [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            echo "Not the first Monday of the month - skipping."
            exit 0
          fi
          python3 << 'EOF'
          import smtplib, os
          from email.mime.text import MIMEText
          from datetime import datetime, timezone

          msg = MIMEText(
              "Correo automatico mensual para mantener activa la clave SMTP de Brevo "
              "usada por las automatizaciones de b602-monitor.\n\n"
              "Generado: " + datetime.now(timezone.utc).strftime("%Y-%m-%d %H:%M:%S UTC")
          )
          msg["Subject"] = "[HEARTBEAT] b602-monitor - Brevo key alive"
          msg["From"] = os.environ["BREVO_SENDER"]
          msg["To"] = os.environ["ALERT_EMAIL"]

          with smtplib.SMTP("smtp-relay.brevo.com", 587) as s:
              s.starttls()
              s.login(os.environ["BREVO_USER"], os.environ["BREVO_SMTP_KEY"])
              s.sendmail(os.environ["BREVO_SENDER"], os.environ["ALERT_EMAIL"], msg.as_string())

          print("Heartbeat email sent.")
          EOF
